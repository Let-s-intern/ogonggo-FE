# main 으로 올라오는 PR 만 검사한다. 브랜치 push 마다 돌리면 같은 커밋을 여러 번 보게 되고,
# main push 는 이미 이 검사를 통과한 커밋이라 다시 볼 이유가 없다.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# 같은 PR 에 커밋을 더 올리면 앞의 실행은 버린다.
concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # 무엇이 바뀌었는지 한 번만 판정하고 나머지 job 이 그 결과를 쓴다.
  #
  # turbo 의 `--affected` 를 먼저 시도했지만 이 저장소에서는 무엇을 바꾸든 항상 전체
  # 패키지를 돌려줘서 스코프 역할을 못 한다 (turbo 2.10.12 로 admin 한 파일만 바꾼
  # 커밋에서도 `//, @ogonggo/api, @ogonggo/ui, admin, web` 을 반환). 그래서 git diff 로
  # 직접 나누고 `--filter` 에 넘긴다.
  scope:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.classify.outputs.run }}
      filter: ${{ steps.classify.outputs.filter }}
      format_paths: ${{ steps.classify.outputs.format_paths }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          web=false
          admin=false
          launch_notice=false
          shared=false

          while IFS= read -r file; do
            case "$file" in
              apps/web/*)   web=true ;;
              apps/admin/*) admin=true ;;
              # 런칭 전 임시 앱. 2026-09-23 뒤 앱과 함께 이 줄들도 지운다
              # (apps/launch-notice/README.md).
              apps/launch-notice/*) launch_notice=true ;;
              # 공용 패키지는 web·admin 이 함께 쓴다. 여기가 바뀌면 앱 하나만 봐서는
              # 깨진 걸 못 잡으므로 전체를 돈다. 루트 설정도 마찬가지다.
              # (launch-notice 는 packages/ 를 쓰지 않지만, 전체를 돌아도 몇 초다.)
              packages/*) shared=true ;;
              package.json|pnpm-lock.yaml|pnpm-workspace.yaml|turbo.json) shared=true ;;
              tsconfig*.json|.oxlintrc.json|.oxfmtrc.json) shared=true ;;
              .github/workflows/*) shared=true ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)

          if [ "$shared" = true ]; then
            # filter 를 비우면 turbo 가 전체 워크스페이스를 돈다.
            filter=''
            format_paths='.'
            run=true
          else
            filter=''
            format_paths=''
            if [ "$web" = true ]; then
              filter="$filter --filter=web"
              format_paths="$format_paths apps/web"
            fi
            if [ "$admin" = true ]; then
              filter="$filter --filter=admin"
              format_paths="$format_paths apps/admin"
            fi
            if [ "$launch_notice" = true ]; then
              filter="$filter --filter=launch-notice"
              format_paths="$format_paths apps/launch-notice"
            fi
            if [ -n "$filter" ]; then run=true; else run=false; fi
          fi

          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "filter=$filter" >> "$GITHUB_OUTPUT"
          echo "format_paths=$format_paths" >> "$GITHUB_OUTPUT"

          echo "web=$web admin=$admin launch-notice=$launch_notice shared=$shared" >> "$GITHUB_STEP_SUMMARY"
          echo "turbo filter: ${filter:-(전체)}" >> "$GITHUB_STEP_SUMMARY"

  # 순서는 타입체크 → 린트 → 포맷 → 보안이다. `needs` 로 묶었으므로 앞이 실패하면
  # 뒤는 돌지 않는다. 앞 단계가 건너뛰어지면(코드 변경 없는 PR) 뒤도 함께 건너뛴다.
  type-check:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tsgo (@typescript/native-preview) 로 각 패키지의 `type-check` 를 돈다.
      - run: pnpm turbo run type-check ${{ needs.scope.outputs.filter }}

  lint:
    needs: [scope, type-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # oxlint. 규칙은 루트 `.oxlintrc.json` 이 정한다.
      - run: pnpm turbo run lint ${{ needs.scope.outputs.filter }}

  format:
    needs: [scope, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # oxfmt. `--check` 는 고치지 않고 어긋난 파일만 알려준다.
      # 고치려면 로컬에서 `pnpm format`.
      - run: pnpm exec oxfmt --check ${{ needs.scope.outputs.format_paths }}

  # 보안은 두 갈래다. 의존성(pnpm audit)과 코드(CodeQL). 둘 다 저장소 전체가
  # 대상이라 스코프를 나누지 않는다 — lockfile 은 하나고, CodeQL 은 호출 경로를
  # 따라가므로 바뀐 파일만 봐서는 의미가 없다.
  audit:
    needs: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      # high 이상만 막는다. low/moderate 까지 막으면 고칠 수 없는 전이 의존성
      # 하나에 PR 전체가 멈춘다.
      - run: pnpm audit --audit-level=high

  codeql:
    needs: format
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # JS/TS 는 컴파일이 필요 없다. 빌드를 돌리지 않으므로 설치도 생략한다.
          build-mode: none
      - uses: github/codeql-action/analyze@v4
